services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: splitloom-postgres
    environment:
      POSTGRES_DB: splitloom_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
    ports:
      - "5434:5432"
    volumes:
      - splitloom_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d splitloom_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: splitloom-redis
    ports:
      - "6380:6379"
    volumes:
      - splitloom_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  splitloom_pgdata:
  splitloom_redisdata:
